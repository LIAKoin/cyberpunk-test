services:
    # База данных
    db:
        image: mysql:5.7
        container_name: wp_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
        volumes:
            - ./db:/var/lib/mysql
        ports:
            - "3306:3306"

    # WordPress
    wordpress:
        build:
            context: ./docker/wordpress
        image: cyberpunk-wp-wordpress:local
        container_name: wp_site
        restart: always
        depends_on:
            - db
        ports:
            - "8080:80" # Сайт будет доступен по адресу http://localhost:8080
        environment:
            WORDPRESS_DB_HOST: db:3306
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_HOME', 'http://localhost:8080');
                define('WP_SITEURL', 'http://localhost:8080');
        volumes:
            - ./my-htaccess.conf:/var/www/html/.htaccess
            - ./robots.txt:/var/www/html/robots.txt
            # Монтируем папку с темой прямо из нашей файловой системы
            - ./wordpress/wp-content/themes/my-custom-theme:/var/www/html/wp-content/themes/my-custom-theme
            # Если понадобятся плагины или загрузки
            - ./wordpress/wp-content/plugins:/var/www/html/wp-content/plugins
            - ./wordpress/wp-content/uploads:/var/www/html/wp-content/uploads

    # phpMyAdmin (удобно для управления БД, опционально)
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: wp_phpmyadmin
        restart: always
        depends_on:
            - db
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_USER: wordpress
            PMA_PASSWORD: wordpress
