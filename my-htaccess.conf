# Сначала включаем MIME-типы для надежности
<IfModule mod_mime.c>
    AddType image/png .png
    AddType image/jpeg .jpg .jpeg
    AddType image/gif .gif
    AddType image/webp .webp
    AddType image/svg+xml .svg
    AddType text/css .css
    AddType application/javascript .js
    AddType font/woff .woff
    AddType font/woff2 .woff2
</IfModule>

# Включаем expires
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresDefault "access plus 1 month"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/jpg "access plus 1 year"
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/gif "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType font/woff "access plus 1 year"
    ExpiresByType application/x-font-ttf "access plus 1 year"
    ExpiresByType application/x-font-woff "access plus 1 year"
</IfModule>

# Добавляем заголовки Cache-Control (регистронезависимые)
<IfModule mod_headers.c>
    <FilesMatch "\.(?i:ico|jpg|jpeg|png|gif|webp|svg|css|js|woff|woff2|ttf)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    
    # Дополнительно: отключаем кеширование для административных URL
    <FilesMatch "wp-(login|admin|includes)">
        Header unset Cache-Control
        Header unset Expires
    </FilesMatch>
</IfModule>

# Остальные стандартные правила WordPress
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</IfModule>
